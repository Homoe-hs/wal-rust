[package]
name = "wal-rust"
version = "0.14.11"
authors = ["He Sheng"]
edition = "2021"
rust-version = "1.90"
description = "WAL: Waveform Analysis Language — high-performance CLI/REPL for querying VCD/FST/FSDB waveforms"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Homoe-hs/wal-rust"
homepage = "https://github.com/Homoe-hs/wal-rust"
documentation = "https://github.com/Homoe-hs/wal-rust/tree/main/docs"
keywords = ["wal", "vcd", "fst", "fsdb", "waveform", "verilog", "eda"]
categories = ["command-line-utilities", "hardware"]
# 默认 run 的目标(有 lib 时 cargo run 需要它)
default-run = "wal-rust"
# 打包上 crates.io 时排除本地/历史资产(体积与隐私)
exclude = ["docs/history/", "test_samples/", "bench/"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# 解析 - tree-sitter
tree-sitter = "0.22"
tree-sitter-wal = { path = "tree-sitter-wal" }

# REPL
rustyline = "14"

# FST decompression
lz4_flex = "0.11"  # LZ4 decompression
flate2 = "1.0"      # Zlib decompression

# VCD decompression
bzip2 = "0.4"      # Bzip2 decompression

# 错误处理
anyhow = "1"
thiserror = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# 内存分配器
mimalloc = { version = "0.1", default-features = false }

# 内存管理
bumpalo = "3"

# 内存映射
memmap2 = "0.9"

# 快速字节搜索
memchr = "2.5"

# LRU cache
lru = "0.12"

# Parallel processing
rayon = "1.10"
num_cpus = "1.16"
wellen = "0.20.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
itoa = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
