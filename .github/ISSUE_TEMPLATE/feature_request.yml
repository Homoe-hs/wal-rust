name: 💡 功能建议
description: 新的算子、格式支持、CLI 体验改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先讲场景(你在查什么波形、卡在哪一步), 再讲方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的用法长什么样
      description: 贴一段"希望可以这样写"的 WAL 表达式或命令行
      render: shell
    validations:
      required: false
  - type: input
    id: scale
    attributes:
      label: 涉及的波形规模
      description: 文件大小 / 信号数 / 时间戳数(影响实现方案)
    validations:
      required: false
